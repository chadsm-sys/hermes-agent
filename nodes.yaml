# Mission Control v0 — node registry
# SAFETY: tokens NEVER live in this file. `token_env` names an environment
# variable expected in the operator-managed .env. A node with enabled: false
# is never contacted, even in live mode.
nodes:
  - id: mbp
    label: MacBook Pro
    role: aggregator
    # The desktop app's own local backend (hermes serve). Port is dynamic
    # (--port 0): if it changes on desktop restart the card degrades to
    # offline — exactly the designed failure mode, no risk. Loopback only.
    url: http://127.0.0.1:49772
    enabled: true             # live-read-only demo node (local machine only)
    read_only: true
    token_env: null

  - id: mac-mini
    label: Mac mini (PRODUCTION)
    role: production
    # Discovered 2026-07-04 (read-only recon): tailnet macs-mac-mini-1 =
    # 100.118.113.115 (offline, last seen 14h); LAN macs-mac-mini.local =
    # 10.0.0.162 (no ping response — asleep/off). PORT unknown until Chad
    # checks the mini's dashboard/serve port. Do NOT enable until M0 passes.
    url: http://macs-mac-mini-1.tailnet:REPLACE-PORT
    enabled: false            # HARD GATE: requires Chad-provisioned token + M0 PASS
    read_only: true           # never mutated by broker, enforced in code
    token_env: MC_MACMINI_TOKEN

  - id: dgx-spark
    label: DGX Spark
    role: lab
    url: https://REPLACE-dgx-tailnet-host:PORT
    enabled: false
    read_only: true
    token_env: MC_DGX_TOKEN
