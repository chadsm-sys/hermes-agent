# Mission Control v0 — node registry
# SAFETY: tokens NEVER live in this file. `token_env` names an environment
# variable expected in the operator-managed .env. A node with enabled: false
# is never contacted, even in live mode.
nodes:
  - id: mbp
    label: MacBook Pro
    role: aggregator
    # The desktop app's own local backend (hermes serve). Port is dynamic
    # (--port 0): if it changes on desktop restart the card degrades to
    # offline — exactly the designed failure mode, no risk. Loopback only.
    url: http://127.0.0.1:49772
    enabled: true             # live-read-only demo node (local machine only)
    read_only: true
    token_env: null

  - id: mac-mini
    label: Mac mini (PRODUCTION)
    role: production
    # M0 PASSED 2026-07-04: mini's Hermes (v0.18.0, gateway running) binds
    # LOOPBACK-ONLY on 127.0.0.1:49170 — direct tailnet TCP is impossible by
    # the mini's own design. Read-only transport = SSH tunnel (key-auth):
    #   ssh -N -o RemoteCommand=none -o ExitOnForwardFailure=yes \
    #       -L 127.0.0.1:49171:127.0.0.1:49170 mini
    # /api/status is public; /api/system/stats is token-gated and degrades
    # to null metrics until MC_MACMINI_TOKEN is provisioned by Chad.
    url: http://127.0.0.1:49171
    enabled: true             # M0 PASS + tunnel-only loopback URL; GET-only enforced in connector
    read_only: true           # never mutated by broker, enforced in code
    token_env: MC_MACMINI_TOKEN

  - id: dgx-spark
    label: DGX Spark
    role: lab
    url: https://REPLACE-dgx-tailnet-host:PORT
    enabled: false
    read_only: true
    token_env: MC_DGX_TOKEN
